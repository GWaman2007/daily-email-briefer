[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "daily-briefer"
version = "2.0.0"
description = "Single-user, 100% serverless, zero-maintenance AI news intelligence system"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "supabase>=2.0.0",
    "google-genai>=0.1.0",
    "tavily-python>=0.3.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0"
]

[tool.setuptools.packages.find]
where = ["src"]
